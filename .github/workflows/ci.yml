name: Сборка Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверить Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - run: bash gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Проверить APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/deck.json | jq -e '
            length == 177 and
            ([.[] | select(.category == "hero")] | length) == 127 and
            ([.[] | select(.category == "item")] | length) == 50'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > apk-permissions.txt
          ! grep -q android.permission.INTERNET apk-permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dota-spy-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
